<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisa Residência</title>
<meta name="description" content="Revisões espaçadas adaptativas para preparação de residência médica.">
<meta name="theme-color" content="#0E7C6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revisa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div class="app" hidden>
  <nav class="nav" id="nav" aria-label="Navegação principal">
    <div class="brandrow"><div class="logo">R</div><div><strong>Revisa</strong><span class="small">Residência médica</span></div></div>
    <button class="tab" data-tab="agenda" id="tab-agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Agenda</span></button>
    <button class="tab" data-tab="painel" id="tab-painel"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg><span>Painel</span></button>
    <button class="tab" data-tab="assuntos" id="tab-assuntos"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Assuntos</span></button>
    <button class="tab" data-tab="historico" id="tab-historico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Histórico</span></button>
    <button class="tab" data-tab="config" id="tab-config"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg><span>Config</span></button>
  </nav>
  <div class="content">
    <header class="topbar">
      <div class="brand"><div class="logo">R</div><div><h1 id="page-title">Agenda</h1><div class="date"><span id="topbar-date"></span> <button class="sync" id="sync" hidden title="Clique para sincronizar agora"></button></div></div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="sm" id="btn-install" hidden>Instalar app</button>
        <button class="primary sm desktop-only" id="btn-novo">+ Novo assunto</button>
      </div>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
</div>
<button class="fab" id="fab-novo" aria-label="Novo assunto">+</button>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
